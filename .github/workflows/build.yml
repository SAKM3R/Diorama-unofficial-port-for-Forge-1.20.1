name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee build.log

      - name: Upload the mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: diorama-forge-1.20.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # The build log, and the jar when there is one, on the ci-logs branch, so they can be read
      # with git alone.
      - name: Publish the build log
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/build.log || echo "no log" > /tmp/out/build.log
          echo "${{ job.status }} ${{ github.sha }}" > /tmp/out/status.txt
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          rm -f /tmp/out/*-sources.jar
          cd /tmp/out
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
