name: Release

# Builds the mod and publishes it as a release: on pushing a tag like v0.2.1-forge-1.20.1, or by
# hand from the Actions tab (Run workflow), which makes the tag named in the form.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.2.1-forge-1.20.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle build --stacktrace

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Diorama ${{ inputs.tag || github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
