name: Release

# Pushing a tag like v0.2.1-forge-1.20.1 builds the mod at that tag and publishes it as a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle build --stacktrace

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Diorama ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
