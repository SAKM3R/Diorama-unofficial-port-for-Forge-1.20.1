org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.20.1
forge_version=47.3.0

mod_version=0.2.1
mod_group=dev.diorama

# The build runs on JDK 21 and the mod runs on Java 21. The class files are Java 17's format by
# default, because Forge 1.20.1 ships Mixin 0.8.5, which only knows compatibility levels up to
# Java 17/18: the mod still runs on Java 21 exactly the same. Set this to 21 to compile Java 21
# class files instead (the game will then refuse to start on Java 17).
java_release=17
